name: Crowdin

on:
  push:
    branches:
      - main
    paths:
      - '**.xlf'
  workflow_dispatch:

jobs:
  sync:
    name: Synchronize with Crowdin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The language packs TYPO3 serves are built from Crowdin, and an installation
      # prefers the pack over the file shipped here. Translations that stay in this
      # repository therefore never reach a backend, so they are uploaded as the
      # approved version. Nothing is downloaded: this repository stays the source
      # of truth for English and German.
      - name: Upload sources and translations
        uses: crowdin/github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: '.crowdin.yml'
          project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          crowdin_branch_name: 'main'
          upload_sources: true
          upload_translations: true
          auto_approve_imported: true
          download_sources: false
          download_translations: false
